
services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=weather_db
    env_file:
      - .env.test
    volumes:
      - test-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d weather_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=test
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=weather_db
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run test:migrate && npm run test:integration"
    networks:
      - test-network

  db-check:
    image: postgres:14
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGPASSWORD=${DB_PASSWORD}
    env_file:
      - .env.test
    depends_on:
      app:
        condition: service_completed_successfully
    command: psql -h db -U ${DB_USER} -d postgres -c "SELECT datname FROM pg_database;"
    networks:
      - test-network

volumes:
  test-db-data:

networks:
  test-network:
    driver: bridge