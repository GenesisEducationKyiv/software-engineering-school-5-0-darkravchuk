name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start Docker services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for database to be ready
        run: docker compose -f docker-compose.test.yml run app sh -c "until pg_isready -h db -U ${DB_USER} -d weather_db; do sleep 1; done"

      - name: Run integration tests
        env:
          DB_USER: postgres
          DB_PASSWORD: secret
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: weather_db
          SENDGRID_API_KEY: test-sendgrid-api-key
          WEATHER_API_KEY: test-weather-api-key
        run: docker compose -f docker-compose.test.yml run app sh -c "npm run test:migrate && npm run test:integration"

      - name: Run database check
        env:
          DB_USER: postgres
          DB_PASSWORD: secret
        run: docker compose -f docker-compose.test.yml run db-check

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
