name: E2E Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: weather_db
      DB_HOST: db
      DB_PORT: 5432
      DOMAIN: http://localhost
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
      PORT: 3000
      SERVER_HOST: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run E2E tests
        env:
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: weather_db
          DB_HOST: db
          DB_PORT: 5432
          DOMAIN: http://localhost
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          PORT: 3000
          SERVER_HOST: backend
        run: npm run test:e2e:pipeline

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30